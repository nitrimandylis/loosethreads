<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Four threads running to one pin.

    Not an X: two crossed lines at this size read as a close button. Threads
    converging on a pin head is the wall's actual gesture, and it survives
    being 16px in a tab strip, where it reduces to a red mark on cork.

    The angles are deliberately uneven, none leaves through a corner, and one
    runs straight past the pin and out the other side rather than stopping at
    it. Symmetry is a bug here for the same reason it is a bug on the board:
    the wall is supposed to look strung by hand at 2am. Four threads that all
    terminate at the centre came out looking like a ribbon.

    The threads sag. A straight line is what every node editor draws, and it
    is the clearest tell that a wall was rendered rather than tied, so they
    carry the same quadratic droop the board uses (stringCurve in wall.ts).

    Colours are the design system's own tokens, not approximations, but the
    string runs one step brighter than the wall's (red-lit, not red-string):
    at 16px on cork the darker red turns to mud.

    cork #6f5233 · cork-hi #8d6b42 · cork-low #543c22
    red-lit #e24a3f · red-string #c0231f · red-dark #7d0f0a
  -->
  <defs>
    <radialGradient id="cork" cx="40%" cy="32%" r="82%">
      <stop offset="0" stop-color="#96733f" />
      <stop offset="0.58" stop-color="#77582f" />
      <stop offset="1" stop-color="#4f3820" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="5" fill="url(#cork)" />

  <!-- Each thread is drawn twice. The dark pass sits a pixel lower: that is
       the shadow it casts on the cork, and it is what stops the string
       looking printed on rather than stretched over. -->
  <g fill="none" stroke-linecap="round" stroke="#33220f" stroke-opacity="0.5" stroke-width="2.9">
    <path d="M-1 4.6 Q 13 14.6 33 25.6" />
    <path d="M33 9.6 Q 24 13.6 16 16.4" />
    <path d="M20 33.6 Q 18.5 25.6 16 16.4" />
    <path d="M-1 21.6 Q 7 20.6 16 16.4" />
  </g>
  <g fill="none" stroke-linecap="round" stroke="#e24a3f" stroke-width="2.5">
    <path d="M-1 4 Q 13 14 33 25" />
    <path d="M33 9 Q 24 13 16 15.8" />
    <path d="M20 33 Q 18.5 25 16 15.8" />
    <path d="M-1 21 Q 7 20 16 15.8" />
  </g>

  <!-- The pin they all run to. Small on purpose: at 16px a big head swallows
       the threads and the whole thing becomes a dot. -->
  <ellipse cx="16" cy="17.9" rx="3.4" ry="1.3" fill="#33220f" fill-opacity="0.45" />
  <circle cx="16" cy="15.4" r="3.6" fill="#7d0f0a" />
  <circle cx="16" cy="15" r="3" fill="#e2372c" />
  <circle cx="14.9" cy="13.9" r="1" fill="#ff8b7d" />
</svg>
